name: ffmpegpp_gui
description: "FFmpeg++ Desktop — 视频处理工具"
publish_to: 'none'
version: 5.20.43+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  uuid: ^4.6.0
  http: ^1.6.0
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  ffi: ^2.2.0
  archive: ^4.3.0
  # 替换已停维的 flutter_markdown（pub.dev 2025-05-30 标记 discontinued）。
  # API 同名同形（MarkdownBody / MarkdownStyleSheet），仅 import 路径变化。
  flutter_markdown_plus: ^1.0.12
  just_audio: ^0.10.6
  oc_liquid_glass: ^0.3.0
  flutter_svg: ^2.3.0

dependency_overrides:
  # Flutter SDK 将 vector_math 精确钉在 2.2.0，但上游传递依赖要求 ^2.4.x，
  # 故此处越过 SDK 的钉以完成版本求解。全项目零处直接 import，仅作依赖解算用。
  vector_math: ^2.4.3
  # 本地 vendor：修复上游 u_size 未写入导致的 shader 全 NaN（无 3D/玻璃失效）
  oc_liquid_glass:
    path: third_party/oc_liquid_glass

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - rele/icon.png
    - rele/wx.png
    - rele/zfb.jpg
    - rele/logic_gates/
