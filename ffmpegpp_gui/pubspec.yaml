name: ffmpegpp_gui
description: "FFmpeg++ Desktop — 视频处理工具"
publish_to: 'none'
version: 5.20.43+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  uuid: ^4.6.0
  http: ^1.6.0
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  # 真正脱离应用的独立系统窗口（元素/属性面板、AI 面板拖出为独立窗口）。
  # 注意：每个子窗口是**独立的 Flutter 引擎**，无法共享主窗口内存里的 AppState，
  # 面板数据必须经 WindowMethodChannel 同步 —— 见 lib/services/multi_window.dart。
  # 三平台各需一处原生注册（windows/runner/flutter_window.cpp、
  # macos/Runner/MainFlutterWindow.swift、linux/runner/my_application.cc），
  # 否则子窗口内调不动 window_manager 等插件。
  #
  # 走本地 vendor（third_party/，与 oc_liquid_glass 同一惯例）而非 hosted：
  # 本机构建环境无法让 Dart 直连 pub.dev，hosted 依赖会让 pub get 直接失败。
  # 该包零第三方传递依赖，path 引用可完全离线解析。
  desktop_multi_window:
    path: third_party/desktop_multi_window
  ffi: ^2.2.0
  archive: ^4.3.0
  # 替换已停维的 flutter_markdown（pub.dev 2025-05-30 标记 discontinued）。
  # API 同名同形（MarkdownBody / MarkdownStyleSheet），仅 import 路径变化。
  flutter_markdown_plus: ^1.0.12
  just_audio: ^0.10.6
  oc_liquid_glass: ^0.3.0
  flutter_svg: ^2.3.0

dependency_overrides:
  # Flutter SDK 将 vector_math 精确钉在 2.2.0，但上游传递依赖要求 ^2.4.x，
  # 故此处越过 SDK 的钉以完成版本求解。全项目零处直接 import，仅作依赖解算用。
  vector_math: ^2.4.3
  # 本地 vendor：修复上游 u_size 未写入导致的 shader 全 NaN（无 3D/玻璃失效）
  oc_liquid_glass:
    path: third_party/oc_liquid_glass

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - rele/icon.png
    - rele/wx.png
    - rele/zfb.jpg
    - rele/logic_gates/
