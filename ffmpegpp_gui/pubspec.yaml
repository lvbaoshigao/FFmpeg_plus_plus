name: ffmpegpp_gui
description: "FFmpeg++ Desktop — 视频处理工具"
publish_to: 'none'
version: 5.2.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  window_manager: ^0.4.3
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.2.0
  crypto: ^3.0.6
  desktop_drop: ^0.7.1
  ffi: ^2.1.3
  archive: ^4.0.9
  flutter_markdown: ^0.7.7+1
  just_audio: ^0.9.40
  dynamic_glass_glmv: ^0.2.4
  glass_liquid_navbar: ^0.2.0
  settings_ui_plus: ^0.2.8
  oc_liquid_glass: ^0.3.0
  flutter_svg: ^2.3.0

dependency_overrides:
  vector_math: ^2.4.0
  # 本地 vendor：修复上游 u_size 未写入导致的 shader 全 NaN（无 3D/玻璃失效）
  oc_liquid_glass:
    path: third_party/oc_liquid_glass

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - rele/icon.png
    - rele/wx.png
    - rele/zfb.jpg
    - rele/logic_gates/
