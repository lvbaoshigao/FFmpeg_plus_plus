name: Code Check

# 每次 push 到 main 及 PR 时自动检查 Dart 代码质量。
# 也可手动触发对任意分支的检查。
#
# 作用：在 debug-build 之前快速发现编译错误、类型错误、lint 违规，
# 避免等待完整构建后才发现问题。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffmpegpp_gui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --fatal-warnings

  test:
    name: flutter test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffmpegpp_gui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test