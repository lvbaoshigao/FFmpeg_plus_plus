name: Build & Release

# 构建流程拆分为「编译」与「打包」两个阶段（job 级别拆分）：
#   compile-*  只做编译，把原始产物打包成 tar.gz 上传为 artifact
#   package-*  只做打包（Inno Setup / deb / DMG），失败时可用
#              GitHub Actions 的 "Re-run failed jobs" 只重跑该打包 job，
#              编译产物直接从 artifact 复用，无需重新编译。
on:
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════
  # 编译阶段 — Windows x86_64
  # ══════════════════════════════════════════
  compile-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache C++ backend build
        uses: actions/cache@v4
        with:
          path: server_cpp/build_win
          key: ${{ runner.os }}-${{ runner.arch }}-cpp-v1-${{ hashFiles('server_cpp/CMakeLists.txt', 'server_cpp/src/**', 'server_cpp/include/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cpp-v1-

      - name: Build C++ backend (ffmpegpp.dll)
        run: |
          cd server_cpp
          if not exist build_win mkdir build_win
          cd build_win
          cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          nmake
        shell: cmd

      - name: Build Flutter GUI
        run: |
          cd ffmpegpp_gui
          flutter pub get
          flutter build windows --release

      - name: Copy backend DLL to bundle
        run: |
          copy server_cpp\build_win\ffmpegpp.dll ffmpegpp_gui\build\windows\x64\runner\Release\ffmpegpp.dll
        shell: cmd

      - name: Pack bundle
        run: |
          tar -czf "$env:GITHUB_WORKSPACE/windows-bundle.tar.gz" -C "ffmpegpp_gui/build/windows/x64/runner/Release" .
        shell: pwsh

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: windows-bundle.tar.gz

  # ══════════════════════════════════════════
  # 编译阶段 — Linux x86_64
  # ══════════════════════════════════════════
  compile-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtk-3-dev pkg-config ninja-build \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Cache C++ backend build
        uses: actions/cache@v4
        with:
          path: server_cpp/build_linux
          key: ${{ runner.os }}-${{ runner.arch }}-cpp-v1-${{ hashFiles('server_cpp/CMakeLists.txt', 'server_cpp/src/**', 'server_cpp/include/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cpp-v1-

      - name: Build C++ backend (libffmpegpp.so)
        run: |
          cd server_cpp
          mkdir -p build_linux
          cd build_linux
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Build Flutter GUI
        run: |
          cd ffmpegpp_gui
          flutter pub get
          flutter build linux --release

      - name: Assemble bundle
        run: |
          mkdir -p output
          cp -r ffmpegpp_gui/build/linux/x64/release/bundle/* output/
          cp server_cpp/build_linux/libffmpegpp.so output/lib/

      - name: Pack bundle
        run: tar -czf linux-x64-bundle.tar.gz -C output .

      - name: Upload Linux x64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundle
          path: linux-x64-bundle.tar.gz

  # ══════════════════════════════════════════
  # 编译阶段 — Linux ARM64
  # ══════════════════════════════════════════
  compile-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtk-3-dev pkg-config ninja-build clang curl git unzip xz-utils \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good

      - name: Setup Flutter (manual for ARM64)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter precache --linux
          flutter doctor -v

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('ffmpegpp_gui/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pub-

      - name: Cache C++ backend build
        uses: actions/cache@v4
        with:
          path: server_cpp/build_linux
          key: ${{ runner.os }}-${{ runner.arch }}-cpp-v1-${{ hashFiles('server_cpp/CMakeLists.txt', 'server_cpp/src/**', 'server_cpp/include/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cpp-v1-

      - name: Build C++ backend (libffmpegpp.so)
        run: |
          cd server_cpp
          mkdir -p build_linux
          cd build_linux
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Build Flutter GUI
        run: |
          cd ffmpegpp_gui
          flutter pub get
          flutter build linux --release

      - name: Assemble bundle
        run: |
          mkdir -p output
          cp -r ffmpegpp_gui/build/linux/arm64/release/bundle/* output/
          cp server_cpp/build_linux/libffmpegpp.so output/lib/

      - name: Pack bundle
        run: tar -czf linux-arm64-bundle.tar.gz -C output .

      - name: Upload Linux ARM64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-bundle
          path: linux-arm64-bundle.tar.gz

  # ══════════════════════════════════════════
  # 编译阶段 — macOS (Universal: x64 + ARM64)
  # ══════════════════════════════════════════
  compile-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Cache C++ backend build
        uses: actions/cache@v4
        with:
          path: server_cpp/build_macos
          key: ${{ runner.os }}-${{ runner.arch }}-cpp-v1-${{ hashFiles('server_cpp/CMakeLists.txt', 'server_cpp/src/**', 'server_cpp/include/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cpp-v1-

      - name: Build C++ backend (libffmpegpp.dylib)
        run: |
          cd server_cpp
          mkdir -p build_macos
          cd build_macos
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          make -j$(sysctl -n hw.ncpu)

      - name: Build Flutter GUI
        run: |
          cd ffmpegpp_gui
          flutter pub get
          flutter build macos --release

      - name: Assemble .app bundle
        run: |
          APP="ffmpegpp_gui/build/macos/Build/Products/Release/ffmpegpp_gui.app"
          # 复制到 Contents/MacOS（app 启动时在可执行文件目录查找 libffmpegpp.dylib）
          cp server_cpp/build_macos/libffmpegpp.dylib "$APP/Contents/MacOS/libffmpegpp.dylib"

      - name: Strip debug symbols (reduce DMG size)
        run: |
          APP="ffmpegpp_gui/build/macos/Build/Products/Release/ffmpegpp_gui.app"
          # 1) dSYM 绝不能进安装包：Release 配置（dwarf-with-dsym）会在
          #    Products/Release 生成 *.app.dSYM（通用架构下达数十 MB）。
          rm -rf ffmpegpp_gui/build/macos/Build/Products/Release/*.dSYM
          # 2) strip 必须覆盖「无扩展名」的 framework 主二进制——旧脚本只找
          #    *.dylib，匹配不到包体最大的 FlutterMacOS.framework/FlutterMacOS
          #    和 App.framework/App（AOT 快照）。strip -S 只去调试符号，
          #    保留动态符号表，不影响 dlopen/链接。
          strip -S "$APP/Contents/MacOS/libffmpegpp.dylib" 2>/dev/null || true
          for f in "$APP"/Contents/Frameworks/*.framework; do
            name="$(basename "$f" .framework)"
            strip -S "$f/$name" 2>/dev/null || true
          done
          find "$APP/Contents/Frameworks" -name "*.dylib" -exec strip -S {} \; 2>/dev/null || true
          strip -S "$APP/Contents/MacOS/ffmpegpp_gui" 2>/dev/null || true
          # 3) 体积构成打印到 CI 日志：以后包体异常可直接从日志定位大头。
          echo "==== macOS .app 体积构成 ===="
          du -sh "$APP"
          du -h "$APP"/Contents/Frameworks/* 2>/dev/null | sort -rh | head -15

      - name: Pack bundle
        # 只打包 .app 本体（旧写法打包整个 Release/ 目录，会把 dSYM 一并带入）
        run: tar -czf macos-app.tar.gz -C ffmpegpp_gui/build/macos/Build/Products/Release ffmpegpp_gui.app

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos-app.tar.gz

  # ══════════════════════════════════════════
  # 编译阶段 — Android (APK, arm64-v8a)
  # ══════════════════════════════════════════
  compile-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 交叉编译 ffmpeg/libffmpegpp.so 需要 NDK r26d；
      # 同时安装 app/build.gradle.kts 声明的 NDK 28.2 供 Gradle 打包使用。
      - name: Setup Android SDK & NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sudo $SDKM --install "ndk;26.1.10909125" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          sudo $SDKM --install "ndk;28.2.13676358" >/dev/null
          # sdkmanager 以 root 安装 NDK，build_ffmpeg.sh 要以 runner 用户
          # make install 进 $SYSROOT/usr/local，必须把属主改回 runner。
          sudo chown -R runner:docker "$ANDROID_HOME/ndk"

      - name: Ensure Android licenses accepted
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      # 缓存交叉编译产物：key 含脚本+源码 hash，源码或脚本变更会强制重建。
      - name: Cache FFmpeg cross-compile artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-build
            ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/local
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-ndk26.1-v2-${{ hashFiles('build/android/build_ffmpeg.sh', 'build/android/env.sh', 'server_cpp/CMakeLists.txt', 'server_cpp/src/**', 'server_cpp/include/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-ndk26.1-v2-
          save-always: true

      # 交叉编译 ffmpeg/ffprobe（--enable-mediacodec，含硬编）+ libffmpegpp.so。
      # 关键：release APK 必须走这一步重建二进制 —— 此前直接打包 git 里追踪的
      # 旧 jniLibs，导致移动端 GPU 编码实际回退 CPU。build_ffmpeg.sh 的验收
      # 守卫会硬校验产物内确实编译进了 mediacodec 编码器，杜绝再次无声退化。
      - name: Build Android FFmpeg + libffmpegpp
        run: bash build/android/build_ffmpeg.sh
        env:
          FFMPEGPP_CACHE: ${{ runner.temp }}/android-build
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_USER_HOME: ${{ runner.temp }}/.android
          NDK_HOME: ${{ env.NDK_HOME }}

      # 以新鲜 dist/ 产物为准同步到 jniLibs（覆盖 git 追踪的旧二进制），
      # 然后按与本地一致的流程打 APK。
      - name: Build APK (build_apk.sh)
        run: bash build/android/build_apk.sh
        env:
          FFMPEGPP_CACHE: ${{ runner.temp }}/android-build
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_USER_HOME: ${{ runner.temp }}/.android
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
          PUB_CACHE: ${{ env.PUB_CACHE }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ffmpegpp_gui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ══════════════════════════════════════════
  # 打包阶段 — Windows 安装包（Inno Setup）
  # ══════════════════════════════════════════
  package-windows:
    needs: compile-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: bundle

      - name: Build Inno Setup installer
        run: |
          choco install innosetup -y
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          # Copy Chinese language files from repo
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          Copy-Item "make\ChineseSimplified.isl" "$langDir\ChineseSimplified.isl" -Force
          Copy-Item "make\ChineseTraditional.isl" "$langDir\ChineseTraditional.isl" -Force
          # 解压编译产物到 build/ 供 setup.iss 使用
          New-Item -ItemType Directory -Force -Path build
          tar -xzf bundle/windows-bundle.tar.gz -C build
          # Run Inno Setup
          iscc make\setup.iss
        shell: pwsh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FFmpeg++_v*_setup.exe

  # ══════════════════════════════════════════
  # 打包阶段 — Linux x86_64 (.deb)
  # ══════════════════════════════════════════
  package-linux-x64:
    needs: compile-linux-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x64 bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-bundle
          path: bundle

      - name: Build .deb package
        run: |
          mkdir -p deb/DEBIAN
          mkdir -p deb/opt/ffmpegpp
          mkdir -p deb/usr/bin
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps

          # Control file
          cat > deb/DEBIAN/control << 'EOF'
          Package: ffmpegpp
          Version: 5.2.0
          Architecture: amd64
          Maintainer: lvbaoshigao <noreply@github.com>
          Description: FFmpeg++ - Advanced video/image/audio processing tool
           A desktop application for video, image, and audio processing
           with a node-based pipeline editor and batch processing support.
          Depends: libgtk-3-0t64 | libgtk-3-0, ffmpeg
          Section: video
          Priority: optional
          Installed-Size: 25000
          EOF

          # Desktop entry
          cat > deb/usr/share/applications/ffmpegpp.desktop << 'EOF'
          [Desktop Entry]
          Name=FFmpeg++
          Comment=Advanced video/image/audio processing tool
          Exec=/opt/ffmpegpp/ffmpegpp_gui
          Icon=ffmpegpp
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Graphics;
          EOF

          # Launcher script
          echo '#!/bin/bash' > deb/usr/bin/ffmpegpp
          echo 'exec /opt/ffmpegpp/ffmpegpp_gui "$@"' >> deb/usr/bin/ffmpegpp
          chmod 755 deb/usr/bin/ffmpegpp

          # 解压编译产物
          tar -xzf bundle/linux-x64-bundle.tar.gz -C deb/opt/ffmpegpp
          cp "make/FFmpeg++.png" deb/usr/share/icons/hicolor/256x256/apps/ffmpegpp.png
          chmod -R 755 deb/opt/ffmpegpp/

          # Build deb
          dpkg-deb --root-owner-group --build deb ffmpegpp_5.2.0_amd64.deb

      - name: Upload Linux x64 deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: ffmpegpp_5.2.0_amd64.deb

  # ══════════════════════════════════════════
  # 打包阶段 — Linux ARM64 (.deb)
  # ══════════════════════════════════════════
  package-linux-arm64:
    needs: compile-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux ARM64 bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-bundle
          path: bundle

      - name: Build .deb package
        run: |
          mkdir -p deb/DEBIAN
          mkdir -p deb/opt/ffmpegpp
          mkdir -p deb/usr/bin
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps

          cat > deb/DEBIAN/control << 'EOF'
          Package: ffmpegpp
          Version: 5.2.0
          Architecture: arm64
          Maintainer: lvbaoshigao <noreply@github.com>
          Description: FFmpeg++ - Advanced video/image/audio processing tool
           A desktop application for video, image, and audio processing
           with a node-based pipeline editor and batch processing support.
          Depends: libgtk-3-0t64 | libgtk-3-0, ffmpeg
          Section: video
          Priority: optional
          Installed-Size: 25000
          EOF

          cat > deb/usr/share/applications/ffmpegpp.desktop << 'EOF'
          [Desktop Entry]
          Name=FFmpeg++
          Comment=Advanced video/image/audio processing tool
          Exec=/opt/ffmpegpp/ffmpegpp_gui
          Icon=ffmpegpp
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Graphics;
          EOF

          echo '#!/bin/bash' > deb/usr/bin/ffmpegpp
          echo 'exec /opt/ffmpegpp/ffmpegpp_gui "$@"' >> deb/usr/bin/ffmpegpp
          chmod 755 deb/usr/bin/ffmpegpp

          tar -xzf bundle/linux-arm64-bundle.tar.gz -C deb/opt/ffmpegpp
          cp "make/FFmpeg++.png" deb/usr/share/icons/hicolor/256x256/apps/ffmpegpp.png
          chmod -R 755 deb/opt/ffmpegpp/

          dpkg-deb --root-owner-group --build deb ffmpegpp_5.2.0_arm64.deb

      - name: Upload Linux ARM64 deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: ffmpegpp_5.2.0_arm64.deb

  # ══════════════════════════════════════════
  # 打包阶段 — macOS (.dmg)
  # ══════════════════════════════════════════
  package-macos:
    needs: compile-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS app bundle
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: bundle

      - name: Create DMG
        run: |
          mkdir -p dmg_staging
          tar -xzf bundle/macos-app.tar.gz -C dmg_staging
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "FFmpeg++" -srcfolder dmg_staging -ov -format UDZO "FFmpeg++_v5.2.0_macOS.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: FFmpeg++_v5.2.0_macOS.dmg

  # ══════════════════════════════════════════
  # 发布阶段 — 创建 Release (v5.2.0)
  # ══════════════════════════════════════════
  release:
    needs: [package-windows, package-linux-x64, package-linux-arm64, package-macos, compile-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: "{windows-installer,linux-*-deb,macos-dmg,android-apk}"

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 5.2.0
          name: "FFmpeg++ v5.2.0"
          body: |
            ## 🎬 FFmpeg++ v5.2.0

            **专业视频 / 图片 / 音频处理桌面应用** — 基于 Flutter + C++17 + FFmpeg，100% AI 生成代码。

            ### ✨ 主要功能
            - 🧩 蓝图式节点编辑器（25+ 节点类型）
            - 🎞 视频转码（H.264 / H.265 / AV1 / VP9 / SVT-AV1，GPU 加速）
            - 🎵 音频处理（转码 / 变速 / 音量 / 动态压缩 / 元信息编辑）
            - 📝 字幕烧录（SRT / ASS / SSA）
            - 📷 帧提取 / ✂️ 片段截取 / 🖼 图片处理 / 🔗 合并媒体
            - 🤖 内置 AI 助手
            - 📱 Android 移动端适配（底部液态玻璃导航栏、Monet 动态取色、内置 FFmpeg）

            ### 📦 安装包
            - **Windows**: `FFmpeg++_v5.2.0_setup.exe`
            - **Linux x64**: `ffmpegpp_5.2.0_amd64.deb`
            - **Linux ARM64**: `ffmpegpp_5.2.0_arm64.deb`
            - **macOS**: `FFmpeg++_v5.2.0_macOS.dmg`
            - **Android**: `app-release.apk`（arm64-v8a）
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/linux-x64-deb/*.deb
            artifacts/linux-arm64-deb/*.deb
            artifacts/macos-dmg/*.dmg
            artifacts/android-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
