name: Debug Build (Manual)

# 手动触发的调试构建：不发布 Release，只生成可下载产物（artifact）。
# 适合在发布前快速验证某个目标平台 / 某个版本能否编译通过，或给测试人员分发调试包。
#
# 用法：Actions → 「Debug Build (Manual)」→ Run workflow
#   target   —— 要编译的平台（Windows / Linux x64 / Linux ARM64 / macOS / Android）
#   version  —— 版本标签（用于产物命名，仅作标记；实际版本取自检出的 ref/仓库代码）
#   ref      —— 要检出的 git 分支或 tag（默认 main）
#
# 每个平台用 `if` 判断 inputs.target，仅运行被选中的那个 job；
# 产物一律上传为 artifact（artifact 保留期内可下载），不触碰 Release。

on:
  workflow_dispatch:
    inputs:
      target:
        description: '要编译的平台'
        required: true
        type: choice
        options:
          - windows
          - linux-x64
          - linux-arm64
          - macos
          - android
      version:
        description: '版本标签（仅用于产物命名，如 6.0.0-beta1）'
        required: false
        default: '6.0.0-beta1'
        type: string
      ref:
        description: '要检出的 git 分支或 tag（默认 main）'
        required: true
        default: 'main'
        type: string

env:
  VER: ${{ inputs.version }}
  # 锁定 Flutter 版本，与 build-release.yml 保持一致（理由见那边）。
  FLUTTER_VERSION: '3.50.0'

# 调试构建按「目标平台」分组：同一平台重复触发时取消上一次。
# 调试包只用于验证「当前代码能否编过」，旧的那次结果没有意义，
# 让它继续跑只会白占 runner（Android 一次 20~40 分钟）。
# Android 的 ffmpeg 缓存 save 发生在编译成功后，被取消也不会写坏缓存。
concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════
  # Windows x86_64
  # ══════════════════════════════════════════
  debug-windows:
    if: inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Setup MSVC
        shell: pwsh
        run: |
          # 手动调用 vcvars64.bat 导出 MSVC 编译环境（INCLUDE/LIB/LIBPATH/PATH）。
          # 替代已停更的 ilammy/msvc-dev-cmd（其最新 v1.13.0 仍运行在 Node 20，
          # GitHub Actions 已弃用 Node 20）。经 vswhere 定位 VS 安装路径，兼容
          # CI 上的 Enterprise 与本地 Community 版本。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC with VC.Tools.x86.x64 not found via vswhere" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "call `"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|PATH)=') {
              Add-Content -Path $env:GITHUB_ENV -Value $_
            }
          }

      # key 不含源码哈希：稳定命中，源码改动由 CMake 依赖图做增量重编
      - name: Cache C++ backend build
        uses: actions/cache@v5
        with:
          path: server_cpp/build_win
          key: ${{ runner.os }}-${{ runner.arch }}-cpp-v2-${{ hashFiles('server_cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cpp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cpp-v1-

      - name: Build C++ backend (ffmpegpp.dll)
        run: |
          cd server_cpp
          if not exist build_win mkdir build_win
          cd build_win
          cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          nmake
        shell: cmd

      - name: Build Flutter GUI
        run: |
          cd ffmpegpp_gui
          flutter pub get
          flutter build windows --release

      - name: Copy backend DLL to bundle
        run: |
          copy server_cpp\build_win\ffmpegpp.dll ffmpegpp_gui\build\windows\x64\runner\Release\ffmpegpp.dll
        shell: cmd

      - name: Pack portable bundle
        run: |
          tar -czf "FFmpeg++_v$env:VER_windows-x64_portable.tar.gz" -C "ffmpegpp_gui/build/windows/x64/runner/Release" .
        shell: pwsh
        env:
          VER: ${{ inputs.version }}

      - name: Build Inno Setup installer
        run: |
          # 镜像通常已预装 Inno Setup 6，仅缺失时才 choco（省 30~60s）
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          Copy-Item "make\ChineseSimplified.isl" "$langDir\ChineseSimplified.isl" -Force
          Copy-Item "make\ChineseTraditional.isl" "$langDir\ChineseTraditional.isl" -Force
          New-Item -ItemType Directory -Force -Path build
          tar -xzf "FFmpeg++_v$env:VER_windows-x64_portable.tar.gz" -C build
          & $iscc make\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
        shell: pwsh
        env:
          VER: ${{ inputs.version }}

      - name: Upload Windows debug artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: |
            FFmpeg++_v*_windows-x64_portable.tar.gz
            dist/FFmpeg++_v*_setup.exe
          if-no-files-found: error

  # ══════════════════════════════════════════
  # Linux x86_64
  # ══════════════════════════════════════════
  debug-linux-x64:
    if: inputs.target == 'linux-x64'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtk-3-dev pkg-config ninja-build \
            libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      # key 不含源码哈希：稳定命中，源码改动由 CMake 依赖图做增量重编。
      # 原先把 src/include 的 hash 放进 key，等于「源码一变就换一份缓存」，
      # 精确 key 永不命中、缓存条目还会迅速膨胀把仓库 10GB 额度挤爆。
      - name: Cache C++ backend build
        uses: actions/cache@v5
        with:
          path: server_cpp/build_linux
          key: ${{ runner.os }}-${{ runner.arch }}-cpp-v2-${{ hashFiles('server_cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cpp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cpp-v1-

      - name: Build C++ backend (libffmpegpp.so)
        run: |
          cd server_cpp
          mkdir -p build_linux
          cd build_linux
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Build Flutter GUI
        run: |
          cd ffmpegpp_gui
          flutter pub get
          flutter build linux --release

      - name: Assemble portable bundle
        run: |
          mkdir -p output
          cp -r ffmpegpp_gui/build/linux/x64/release/bundle/* output/
          cp server_cpp/build_linux/libffmpegpp.so output/lib/
          tar -czf "FFmpeg++_v${VER}_linux-x64_portable.tar.gz" -C output .
        env:
          VER: ${{ inputs.version }}

      - name: Build .deb package
        run: |
          mkdir -p deb/DEBIAN deb/opt/ffmpegpp deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps
          # heredoc 必须无引号，${VER} 才会展开；此处原先写死 6.0.0-beta1，
          # 传 version=5.31.0 时会出现「文件名 5.31、包内 Version 5.30」。
          cat > deb/DEBIAN/control << EOF
          Package: ffmpegpp
          Version: ${VER}
          Architecture: amd64
          Maintainer: lvbaoshigao <noreply@github.com>
          Description: FFmpeg++ - Advanced video/image/audio processing tool
           A desktop application for video, image, and audio processing
           with a node-based pipeline editor and batch processing support.
          Depends: libgtk-3-0t64 | libgtk-3-0, ffmpeg
          Section: video
          Priority: optional
          Installed-Size: 25000
          EOF
          cat > deb/usr/share/applications/ffmpegpp.desktop << 'EOF'
          [Desktop Entry]
          Name=FFmpeg++
          Comment=Advanced video/image/audio processing tool
          Exec=/opt/ffmpegpp/ffmpegpp_gui
          Icon=ffmpegpp
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Graphics;
          EOF
          echo '#!/bin/bash' > deb/usr/bin/ffmpegpp
          echo 'exec /opt/ffmpegpp/ffmpegpp_gui "$@"' >> deb/usr/bin/ffmpegpp
          chmod 755 deb/usr/bin/ffmpegpp
          tar -xzf "FFmpeg++_v${VER}_linux-x64_portable.tar.gz" -C deb/opt/ffmpegpp
          cp "make/FFmpeg++.png" deb/usr/share/icons/hicolor/256x256/apps/ffmpegpp.png
          chmod -R 755 deb/opt/ffmpegpp/
          dpkg-deb --root-owner-group --build deb "ffmpegpp_${VER}_amd64.deb"
        env:
          VER: ${{ inputs.version }}

      - name: Upload Linux x64 debug artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: |
            FFmpeg++_v*_linux-x64_portable.tar.gz
            ffmpegpp_*_amd64.deb
          if-no-files-found: error

  # ══════════════════════════════════════════
  # Linux ARM64
  # ══════════════════════════════════════════
  debug-linux-arm64:
    if: inputs.target == 'linux-arm64'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtk-3-dev pkg-config ninja-build clang curl git unzip xz-utils \
            libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good

      # ── 安装 Flutter（原生 arm64 SDK）─────────────────────────────────
      # subosito/flutter-action 在 aarch64 runner 上装不了 SDK：它依赖的
      # releases_linux.json 清单里只有 dart_sdk_arch=x64 的条目
      # （官方 release 通道从未发布 Linux arm64 归档），而 action 按
      # RUNNER_ARCH=ARM64 自动取架构做过滤 → `any` 解析结果为空 →
      # "Unable to determine Flutter version for channel: stable
      #  version: any architecture: arm64"。
      # 但 Flutter 官方**有** arm64 宿主引擎产物
      # （flutter_infra_release/flutter/<engine>/linux-arm64/artifacts.zip，
      # 3.50.0 已核实存在），所以像本地一样 clone 仓库、让工具自举下载
      # 宿主产物再 precache，即可得到原生 arm64 SDK。
      # SDK 按版本号缓存：精确命中时直接复用整个 SDK（免拉 1GB+ 仓库）；
      # stable 发新版时改 workflow 级 FLUTTER_VERSION 即切换。
      - name: Cache Flutter SDK (arm64)
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-sdk-${{ env.FLUTTER_VERSION }}-linux-arm64-v1

      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (native arm64)
        run: |
          set -euo pipefail
          if [ ! -x "${RUNNER_TEMP}/flutter/bin/flutter" ]; then
            # 缓存 miss / 上次部分克隆可能留下空目录，先清掉，
            # 否则 git clone 会拒绝写入非空目录
            rm -rf "${RUNNER_TEMP}/flutter"
            git clone https://github.com/flutter/flutter.git \
              --branch "${FLUTTER_VERSION}" --depth 1 "${RUNNER_TEMP}/flutter"
          fi
          # 写入 GITHUB_PATH，后续步骤（flutter pub get / build）才能找到命令
          echo "${RUNNER_TEMP}/flutter/bin" >> "${GITHUB_PATH}"
          # 首次运行工具会自动下载 arm64 Dart SDK + 宿主产物；
          # precache --linux 再补齐 linux 目标产物（embedder/gtk），
          # 让构建阶段不再走网、全部产物进缓存。
          flutter config --no-analytics
          flutter --version
          flutter precache --linux

      # pub 缓存与 SDK 缓存分开：key 含 pubspec.lock 哈希（lock 变化自动换），
      # 不能并进 SDK 的 key —— 否则 pubspec 一动就要重建 1GB+ 的 SDK 缓存。
      - name: Cache pub cache (arm64)
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ env.FLUTTER_VERSION }}-linux-arm64-${{ hashFiles('ffmpegpp_gui/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ env.FLUTTER_VERSION }}-linux-arm64-

      # key 不含源码哈希：稳定命中，源码改动由 CMake 依赖图做增量重编。
      # 原先把 src/include 的 hash 放进 key，等于「源码一变就换一份缓存」，
      # 精确 key 永不命中、缓存条目还会迅速膨胀把仓库 10GB 额度挤爆。
      - name: Cache C++ backend build
        uses: actions/cache@v5
        with:
          path: server_cpp/build_linux
          key: ${{ runner.os }}-${{ runner.arch }}-cpp-v2-${{ hashFiles('server_cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cpp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cpp-v1-

      - name: Build C++ backend (libffmpegpp.so)
        run: |
          cd server_cpp
          mkdir -p build_linux
          cd build_linux
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Build Flutter GUI
        run: |
          cd ffmpegpp_gui
          flutter pub get
          flutter build linux --release

      - name: Assemble portable bundle
        run: |
          mkdir -p output
          cp -r ffmpegpp_gui/build/linux/arm64/release/bundle/* output/
          cp server_cpp/build_linux/libffmpegpp.so output/lib/
          tar -czf "FFmpeg++_v${VER}_linux-arm64_portable.tar.gz" -C output .
        env:
          VER: ${{ inputs.version }}

      - name: Build .deb package
        run: |
          mkdir -p deb/DEBIAN deb/opt/ffmpegpp deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps
          # heredoc 必须无引号，${VER} 才会展开；此处原先写死 6.0.0-beta1，
          # 传 version=5.31.0 时会出现「文件名 5.31、包内 Version 5.30」。
          cat > deb/DEBIAN/control << EOF
          Package: ffmpegpp
          Version: ${VER}
          Architecture: arm64
          Maintainer: lvbaoshigao <noreply@github.com>
          Description: FFmpeg++ - Advanced video/image/audio processing tool
           A desktop application for video, image, and audio processing
           with a node-based pipeline editor and batch processing support.
          Depends: libgtk-3-0t64 | libgtk-3-0, ffmpeg
          Section: video
          Priority: optional
          Installed-Size: 25000
          EOF
          cat > deb/usr/share/applications/ffmpegpp.desktop << 'EOF'
          [Desktop Entry]
          Name=FFmpeg++
          Comment=Advanced video/image/audio processing tool
          Exec=/opt/ffmpegpp/ffmpegpp_gui
          Icon=ffmpegpp
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Graphics;
          EOF
          echo '#!/bin/bash' > deb/usr/bin/ffmpegpp
          echo 'exec /opt/ffmpegpp/ffmpegpp_gui "$@"' >> deb/usr/bin/ffmpegpp
          chmod 755 deb/usr/bin/ffmpegpp
          tar -xzf "FFmpeg++_v${VER}_linux-arm64_portable.tar.gz" -C deb/opt/ffmpegpp
          cp "make/FFmpeg++.png" deb/usr/share/icons/hicolor/256x256/apps/ffmpegpp.png
          chmod -R 755 deb/opt/ffmpegpp/
          dpkg-deb --root-owner-group --build deb "ffmpegpp_${VER}_arm64.deb"
        env:
          VER: ${{ inputs.version }}

      - name: Upload Linux ARM64 debug artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64
          path: |
            FFmpeg++_v*_linux-arm64_portable.tar.gz
            ffmpegpp_*_arm64.deb
          if-no-files-found: error

  # ══════════════════════════════════════════
  # macOS
  # ══════════════════════════════════════════
  debug-macos:
    if: inputs.target == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      # key 不含源码哈希：稳定命中，源码改动由 CMake 依赖图做增量重编
      - name: Cache C++ backend build
        uses: actions/cache@v5
        with:
          path: server_cpp/build_macos
          key: ${{ runner.os }}-${{ runner.arch }}-cpp-v2-${{ hashFiles('server_cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cpp-v2-
            ${{ runner.os }}-${{ runner.arch }}-cpp-v1-

      - name: Build C++ backend (libffmpegpp.dylib)
        run: |
          cd server_cpp
          mkdir -p build_macos
          cd build_macos
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          make -j$(sysctl -n hw.ncpu)

      - name: Build Flutter GUI
        run: |
          cd ffmpegpp_gui
          flutter pub get
          flutter build macos --release

      - name: Assemble .app bundle
        run: |
          APP="ffmpegpp_gui/build/macos/Build/Products/Release/ffmpegpp_gui.app"
          cp server_cpp/build_macos/libffmpegpp.dylib "$APP/Contents/MacOS/libffmpegpp.dylib"

      - name: Strip debug symbols (reduce DMG size)
        run: |
          APP="ffmpegpp_gui/build/macos/Build/Products/Release/ffmpegpp_gui.app"
          # dSYM 不进安装包（Release 默认 dwarf-with-dsym）
          rm -rf ffmpegpp_gui/build/macos/Build/Products/Release/*.dSYM
          # strip 覆盖无扩展名的 framework 主二进制（FlutterMacOS/App 两大件），
          # *.dylib 的 find 匹配不到它们
          strip -S "$APP/Contents/MacOS/libffmpegpp.dylib" 2>/dev/null || true
          for f in "$APP"/Contents/Frameworks/*.framework; do
            name="$(basename "$f" .framework)"
            strip -S "$f/$name" 2>/dev/null || true
          done
          find "$APP/Contents/Frameworks" -name "*.dylib" -exec strip -S {} \; 2>/dev/null || true
          strip -S "$APP/Contents/MacOS/ffmpegpp_gui" 2>/dev/null || true
          echo "==== macOS .app 体积构成 ===="
          du -sh "$APP"
          du -h "$APP"/Contents/Frameworks/* 2>/dev/null | sort -rh | head -15

      - name: Pack portable app bundle
        run: |
          # 只打包 .app 本体，不带 Release/ 目录里的 dSYM 等中间产物
          tar -czf "FFmpeg++_v${VER}_macOS_portable.tar.gz" -C ffmpegpp_gui/build/macos/Build/Products/Release ffmpegpp_gui.app
        env:
          VER: ${{ inputs.version }}

      - name: Create DMG
        run: |
          mkdir -p dmg_staging
          tar -xzf "FFmpeg++_v${VER}_macOS_portable.tar.gz" -C dmg_staging
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "FFmpeg++" -srcfolder dmg_staging -ov -format UDZO "FFmpeg++_v${VER}_macOS.dmg"
        env:
          VER: ${{ inputs.version }}

      - name: Upload macOS debug artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos
          path: |
            FFmpeg++_v*_macOS_portable.tar.gz
            FFmpeg++_v*_macOS.dmg
          if-no-files-found: error

  # ══════════════════════════════════════════
  # Android (arm64-v8a APK)
  # 复用仓库内的交叉编译脚本，通过环境变量把工具链指向 GitHub runner
  # 预装的 Android SDK / NDK，产物 = APK。
  # ══════════════════════════════════════════
  debug-android:
    if: inputs.target == 'android'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # NDK r26d：交叉编译 ffmpeg / libffmpegpp.so
          sudo $SDKM --install "ndk;26.1.10909125" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          # NDK 28.2：app/build.gradle.kts 声明的 ndkVersion（Gradle 打包需要）
          sudo $SDKM --install "ndk;28.2.13676358" >/dev/null
          # sdkmanager 以 root 安装 NDK，目录属主是 root；
          # 后续 build_ffmpeg.sh 要以 runner 用户身份 make install 进
          # $SYSROOT/usr/local（NDK sysroot 内），必须把属主改为 runner。
          sudo chown -R runner:docker "$ANDROID_HOME/ndk"

      - name: Ensure Android licenses accepted
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      # 缓存交叉编译产物。key 只含 ffmpeg 的构建输入（脚本 + env.sh），
      # 不含 server_cpp 源码 —— libffmpegpp.so 的增量由脚本内的 SRC_HASH stamp
      # 自行判断（见 build_ffmpeg.sh §7），CI 层再掺源码 hash 只会让每次改动
      # 都产生一份新缓存，挤爆 10GB 额度且精确 key 永不命中。
      # cache 的 save-always 输入已被 GitHub 弃用（行为也不符合预期），
      # 改为官方推荐的 restore/save 分离写法：ffmpeg 编译成功后立即保存，
      # 即使后续 APK 打包失败，下次重跑也不必从零编译 ffmpeg。
      - name: Restore FFmpeg cross-compile cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/android-build
            ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/local
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-ndk26.1-v3-${{ hashFiles('build/android/build_ffmpeg.sh', 'build/android/env.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-ndk26.1-v3-
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-ndk26.1-v2-
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-ndk26.1-v1-

      - name: Cache Gradle home
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/gradle-home
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-v1-${{ hashFiles('ffmpegpp_gui/android/build.gradle.kts', 'ffmpegpp_gui/android/app/build.gradle.kts', 'ffmpegpp_gui/android/settings.gradle.kts', 'ffmpegpp_gui/android/gradle.properties', 'ffmpegpp_gui/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-v1-

      # build_ffmpeg.sh 会 source env.sh，而 env.sh 只对「未设置」的环境变量
      # 给默认值，因此这里显式 export 的变量会胜出，把工具链指向 runner 路径。
      - name: Build Android FFmpeg + libffmpegpp
        run: |
          bash build/android/build_ffmpeg.sh
        env:
          FFMPEGPP_CACHE: ${{ runner.temp }}/android-build
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_USER_HOME: ${{ runner.temp }}/.android
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
          PUB_CACHE: ${{ env.PUB_CACHE }}
          NDK_HOME: ${{ env.NDK_HOME }}

      # ffmpeg 编译成功即保存缓存（默认 if: success()），后续步骤失败不丢缓存
      - name: Save FFmpeg cross-compile cache
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/android-build
            ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/local
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-ndk26.1-v3-${{ hashFiles('build/android/build_ffmpeg.sh', 'build/android/env.sh') }}

      - name: Flutter pub get & generate local.properties
        run: |
          cd ffmpegpp_gui
          flutter pub get
          # settings.gradle.kts 必须读取 local.properties 获取 sdk.dir / flutter.sdk
          flutter_root=$(cd "$(dirname "$(readlink -f "$(which flutter)")")/.." && pwd)
          echo "sdk.dir=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" > android/local.properties
          echo "flutter.sdk=${flutter_root}" >> android/local.properties
          echo "Generated android/local.properties: sdk.dir=$(sed -n '1s/.*=//p' android/local.properties) flutter.sdk=${flutter_root}"
        env:
          PUB_CACHE: ${{ env.PUB_CACHE }}

      - name: Build APK
        run: |
          bash build/android/build_apk.sh
        env:
          FFMPEGPP_CACHE: ${{ runner.temp }}/android-build
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_USER_HOME: ${{ runner.temp }}/.android
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
          PUB_CACHE: ${{ env.PUB_CACHE }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: android-arm64
          path: |
            ffmpegpp_gui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
