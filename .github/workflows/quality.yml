name: Quality Gate

on:
  push:
    branches:
      - '**'
    paths:
      - 'ffmpegpp_gui/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'ffmpegpp_gui/**'
      # PR 改的如果就是这个 workflow 本身，也要跑一次验证语法/行为
      - '.github/workflows/quality.yml'
  workflow_dispatch:

# 同一分支连续 push 时取消上一次：旧的排队只会白占 runner，
# 而且被更新的提交取代后结果本来就不再需要（最后一次才有效）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Flutter 版本与 build-release.yml / debug-build.yml 一致（理由见那边）。
# 门禁与构建必须用同一 Flutter，否则 analyze/test 结果对发布产物没有参考性。
env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04

    # 卡死保护：正常 analyze+test 约 3~5 分钟，20 分钟足够。
    # 没有这个上限时，分析器偶发挂起会一直占住 runner 直到默认 6 小时。
    timeout-minutes: 20

    # 所有 run 步骤默认在 flutter 包目录下执行（仓库根是 C++ 后端 + 多平台工程）
    defaults:
      run:
        working-directory: ffmpegpp_gui

    steps:
      - uses: actions/checkout@v5

      # `cache: true` 缓存 Flutter SDK + engine artifacts，
      # `pub-cache: true` 缓存 ~/.pub-cache（key 自动含 pubspec.lock 哈希）。
      # 因此**不要**再手写一个 actions/cache 去缓存 ~/.pub-cache：
      # 两者路径相同，会让每次运行多一次 restore + 一次 save，纯属浪费。
      # 版本锁定在 workflow 级 env.FLUTTER_VERSION（与两个构建 workflow 一致）：
      # 上游 stable 发新版不会让门禁突然变红，本地/CI/Release 的 Flutter 同源。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # 底线是 error 必须为 0 —— 这正是「调用点存在、方法定义被静默丢失」
        # 与「漏 import 导致类型未定义」这类问题的拦截线（2026-11-20 实测：
        # pipeline_editor_page.dart 缺 foundation 导入使 ValueListenable 未定义，
        # 4 个测试文件连编译都过不去，而任何 make 工作流都不会发现）。
        #
        # info / warning 暂只报告不阻断：仓库当前还有 WIP 遗留的未引用声明，
        # 门禁若一上线就是红的只会被无视。等这些清理完，把本行收严为
        # `flutter analyze --no-fatal-infos`（即 warning 也阻断）。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit & widget tests
        run: flutter test --reporter expanded
