name: Plugin SDK and Runtime

on:
  push:
    paths:
      - 'plugin_sdk/**'
      - 'server_cpp/**'
      - 'build/windows/**'
      - 'ffmpegpp_gui/assets/plugin_sdk/**'
      - 'docs/public/examples/**'
      - '.github/workflows/plugin-sdk.yml'
  pull_request:
    paths:
      - 'plugin_sdk/**'
      - 'server_cpp/**'
      - 'build/windows/**'
      - 'ffmpegpp_gui/assets/plugin_sdk/**'
      - 'docs/public/examples/**'
      - '.github/workflows/plugin-sdk.yml'
  workflow_dispatch:

concurrency:
  group: plugin-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Report backend build source
        run: |
          git log -1 --format="Backend source: %H %s"
          if ($LASTEXITCODE -ne 0) { throw "Cannot identify backend source commit" }
      - name: Setup MSVC
        run: ./build/windows/setup_msvc.ps1
      - name: Build backend with static WAMR
        run: ./build/windows/build_backend.ps1 -CMakeArguments @('-DFFMPEGPP_ENABLE_PLUGINS=ON', '-DFFMPEGPP_BUILD_TESTS=ON', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON')
      - name: Report WAMR host compiler command
        if: always()
        run: |
          $database = "server_cpp/build_win/compile_commands.json"
          if (Test-Path -LiteralPath $database) {
            $commands = Get-Content -LiteralPath $database -Raw | ConvertFrom-Json
            $commands | Where-Object { $_.file -like "*plugin_runtime.cpp" } | ForEach-Object { $_.command }
          }
      - name: Verify static WAMR host references
        run: |
          $objects = @(Get-ChildItem -LiteralPath "server_cpp/build_win/CMakeFiles/ffmpegpp.dir" -Filter "plugin_runtime.cpp.obj" -Recurse -File)
          if ($objects.Count -ne 1) { throw "Expected exactly one plugin_runtime.cpp.obj" }
          $symbols = @(& dumpbin.exe /symbols $objects[0].FullName)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed to read plugin_runtime.cpp.obj" }
          if ($symbols -match "__imp_wasm_runtime_") {
            throw "Embedded WAMR host still references DLL imports"
          }
          Write-Host "Backend links successfully and its WAMR host has no DLL import references"
      - name: Test static WAMR without command-line API definitions
        run: |
          ctest --test-dir server_cpp/build_win -C Release -R "^wamr_static_link_test$" --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Static WAMR link regression failed" }

  sdk-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install build and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build ffmpeg
      - name: Verify embedded SDK assets
        run: python3 plugin_sdk/tools/sync_assets.py --check
      - name: Compile and test SDK examples and helpers
        run: python3 -m unittest discover -s plugin_sdk/tests -p 'test_*.py' -v
      - name: Configure native plugin tests
        run: cmake -S server_cpp -B /tmp/ffmpegpp-plugin-sdk -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFFMPEGPP_BUILD_TESTS=ON
      - name: Build native plugin tests
        run: cmake --build /tmp/ffmpegpp-plugin-sdk --parallel 2
      - name: Test native plugin execution
        run: ctest --test-dir /tmp/ffmpegpp-plugin-sdk --output-on-failure
      - name: Test compiled SDK nodes through WAMR and FFmpeg
        run: python3 plugin_sdk/tests/native_integration.py --library /tmp/ffmpegpp-plugin-sdk/libffmpegpp.so --ffmpeg /usr/bin/ffmpeg
